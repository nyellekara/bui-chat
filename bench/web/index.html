<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runtime Benchmark</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f1012; color: #f2f2f4; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #app { height: 100%; display: flex; flex-direction: column; background: radial-gradient(circle at 50% -20%, #1a1d26, #0f1012 62%); }
      header { height: 58px; flex: 0 0 auto; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #25272d; background: rgba(17,18,20,.8); }
      .brand { display: flex; gap: 10px; align-items: center; font-weight: 650; }
      .badge { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; color: #17181b; background: linear-gradient(145deg,#f4f4f5,#a7a7ad); font-weight: 800; }
      .status { color: #8f929b; font-size: 11px; }
      main { min-height: 0; flex: 1; display: flex; flex-direction: column; max-width: 820px; width: 100%; margin: 0 auto; }
      #messages { min-height: 0; flex: 1; overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
      .message { max-width: 86%; padding: 12px 15px; border: 1px solid rgba(255,255,255,.1); border-radius: 15px; line-height: 1.5; box-shadow: 0 7px 20px rgba(0,0,0,.14); }
      .message.user { align-self: flex-end; color: #1c1d20; background: #e9e9eb; }
      .message.assistant { align-self: flex-start; background: rgba(29,30,34,.78); }
      .meta { margin-bottom: 6px; color: #888b93; font-size: 10px; }
      .composer { flex: 0 0 auto; margin: 10px 24px 22px; padding: 14px; border: 1px solid rgba(255,255,255,.12); border-radius: 18px; background: rgba(29,30,34,.8); }
      textarea { display: block; width: 100%; min-height: 48px; resize: none; border: 0; outline: 0; background: transparent; color: #fff; font: inherit; }
      .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); color: #777a83; font-size: 10px; }
      button { padding: 7px 14px; border: 0; border-radius: 10px; color: #1b1c20; background: #f3f3f4; font-weight: 650; }
    </style>
  </head>
  <body><div id="app"></div><script src="renderer.js"></script></body>
</html>
